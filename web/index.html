<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"ChocoAI","url":"__SITE__/","description":"A chat assistant. Sign in to search the web, plan bigger tasks, read documents and schedule recurring prompts.","applicationCategory":"ProductivityApplication","operatingSystem":"Any","browserRequirements":"Requires JavaScript","inLanguage":"en","image":"__SITE__/icons/og.png?v=3"}</script>

</head>
<body>
<div id="app" data-store="client">
  <aside class="side" id="side" aria-label="Chats"></aside>
  <main class="main">
    <header class="top">
      <div class="l"><button class="iconbtn" id="btn-chats" aria-label="Chats" hidden></button></div>
      <h1 id="title">ChocoAI</h1>
      <div class="r"><button class="iconbtn" id="btn-new" aria-label="New chat" hidden></button><button class="iconbtn" id="btn-account" aria-label="Account"></button></div>
    </header>
    <div class="msgs-wrap">
      <div class="msgs" id="msgs">
        <div class="col" id="col">
          <div class="empty" id="empty">
            <div class="logo" aria-hidden="true"></div>
            <h2>How can I help?</h2>
            <p>Ask anything.</p>
          </div>
        </div>
      </div>
      <button class="jump" id="jump" type="button" hidden></button>
    </div>
    <div class="composer-wrap" id="composer-wrap">
      <div class="atts" id="atts" hidden></div>
      <form class="composer" id="composer" autocomplete="off">
        <button class="iconbtn attach" id="attach" type="button" aria-label="Attach a file" hidden></button>
        <input id="file" type="file" multiple hidden>
        <label class="sr" for="input">Message</label>
        <textarea id="input" rows="1" placeholder="Message ChocoAI" enterkeyhint="send" autocapitalize="sentences"></textarea>
        <button class="iconbtn effort" id="effort" type="button" aria-haspopup="menu" aria-expanded="false" hidden></button>
        <button class="send" id="send" type="submit" aria-label="Send" disabled></button>
      </form>
      <div class="fine" id="fine"></div>
    </div>
    <div id="login-root"></div>
  </main>
</div>
<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite"></div>
<noscript><p style="padding:24px;text-align:center">ChocoAI is a chat assistant and needs JavaScript to run.</p></noscript>
<script src="/vendor/motion.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>

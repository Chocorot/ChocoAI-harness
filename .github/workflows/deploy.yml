name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # @chocorot/design is a private GitHub Packages package: needs a PAT with read:packages.
      - run: npm ci
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  publish:
    # never on a pull request: that would publish untrusted code under our image name
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build locally first and boot it: tests and `next build` pass on a tree whose IMAGE cannot start (standalone output
      # leaves out what the trace missed).
      - name: Build image (local, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          secrets: |
            gh_packages_token=${{ secrets.GH_PACKAGES_TOKEN }}
          load: true
          tags: choco-harness:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test, the image must start and serve
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 18080:8080 -e AUTH_SECRET="$(openssl rand -hex 32)" choco-harness:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/health
          curl -fsS http://127.0.0.1:18080/api/me | grep '"mode":"public"'
          curl -fsS http://127.0.0.1:18080/ | grep -q 'ChocoAI'
          docker exec smoke sh -c 'pdftotext -v' 2>&1 | head -1
          docker rm -f smoke

      # The server's watchtower polls ghcr.io and restarts the container when :latest changes.
      - uses: docker/build-push-action@v6
        with:
          context: .
          secrets: |
            gh_packages_token=${{ secrets.GH_PACKAGES_TOKEN }}
          push: true
          tags: |
            ghcr.io/chocorot/choco-harness:latest
            ghcr.io/chocorot/choco-harness:sha-${{ github.sha }}
          cache-from: type=gha

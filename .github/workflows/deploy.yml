name: Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Test (backend)
        run: python3 -m unittest test_harness

      - name: Test (web UI logic)
        run: node --test web/test

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The server's watchtower polls ghcr.io and restarts the container when :latest changes.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/chocorot/choco-harness:latest
            ghcr.io/chocorot/choco-harness:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
